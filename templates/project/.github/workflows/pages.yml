# Publishes the design viewer to GitHub Pages on every push to main,
# and once a day so "days ago" and stale flags stay current.
name: Publish design page

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          fetch-depth: 0   # full history: "last touched" dates come from git
      - uses: actions/checkout@v4
        with:
          repository: Escape-Backpack/backpack-kit
          path: backpack-kit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python backpack-kit/kit.py --project project build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: project/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
