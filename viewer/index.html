<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<script>try{var t=localStorage.getItem("ebp-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Adventure Design</title>
<!-- Shared design board from backpack-kit. Do not edit the copy in site/: it is overwritten on every build.
     Three tabs: Story (premise + beats), Puzzles, Props. Questions and assets show inside the record they're about. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Symbols&family=Noto+Sans+Symbols+2&family=Noto+Sans+Runic&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div><div class="eyebrow">Design board</div><h1 id="proj">Adventure</h1><div class="sub" id="sub"></div></div>
  <div class="actions">
    <a class="btn" href="play.html" title="Play the decided game from start to finish">▶ Play-test</a>
    <a class="btn" href="print.html" title="Envelope labels and the cipher card, ready to print">Print envelopes</a>
    <input id="q" type="search" placeholder="Search  ( / )" autocomplete="off" aria-label="Search records">
  </div>
</header>
<nav id="tabs"></nav>
<main id="view"></main>
<div id="scrim" hidden></div>
<aside id="drawer" hidden></aside>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
"use strict";
const D = window.BACKPACK;
const $ = s => document.querySelector(s);
if (!D) {
  document.body.innerHTML = '<main><h2>No data.js found</h2><p>Run <code>python ../backpack-kit/kit.py build</code> in the project folder.</p></main>';
  throw new Error("no data");
}

// ---------- model ----------
const R = D.records;
const byId = Object.fromEntries(R.map(r => [r.id, r]));
const REF = D.refFields;
const back = {};  // target id -> [{from, field}]
for (const r of R) for (const f of REF) for (const t of asList(r[f]).filter(t => t !== "start")) (back[t] ||= []).push({ from: r.id, field: f });
const backOf = (id, field) => (back[id] || []).filter(b => !field || b.field === field).map(b => byId[b.from]).filter(Boolean);
const superseded = r => !!r.superseded_by;
const active = r => r.status !== "parked" && !superseded(r);
const ofType = t => R.filter(r => r.type === t);
const BEAT = D.config.beatLabel || "Structure beat";
const STATUSES = ["idea", "candidate", "decided", "built"];
const ENV = Object.fromEntries((D.envelopes?.envelopes || []).map(e => [e.puzzle, e]));
const beats = () => ofType("beat").filter(active).sort((a, b) => (a.order ?? 999) - (b.order ?? 999));

// Questions show on the record they're about; assets on the prop they're for (else their first link).
const questionsOn = id => ofType("question").filter(q => !superseded(q) && asList(q.about).includes(id));
const openQ = id => questionsOn(id).filter(q => q.status === "open").length;
const filesOn = id => ofType("asset").filter(a => !superseded(a) && (a.for ? a.for === id : asList(a.links)[0] === id));

// ---------- helpers ----------
const sColor = s => `var(--s-${["idea", "candidate", "decided", "built", "open", "answered", "parked"].includes(s) ? s : "idea"})`;
const pill = s => `<span class="pill" style="color:${sColor(s)}">${esc(s || "no status")}</span>`;
const code = (e, cls = "") => e && e.code ? `<span class="sym ${cls}" title="Envelope code">${e.code.map(esc).join("")}</span>`
  : `<span class="flag" title="${e && e.answer ? "The answer has characters the cipher can't encode" : "No answer yet"}">${e && e.answer ? "bad answer" : "no code"}</span>`;
const refChip = id => {
  if (id === "start") return '<span class="ref">In the box from the start</span>';
  const r = byId[id];
  if (!r) return `<span class="ref missing" title="No record with this id">${esc(id)}</span>`;
  return `<button type="button" class="ref" data-id="${esc(id)}" title="${esc(r.title)}"><span class="dot" style="background:${sColor(superseded(r) ? "parked" : r.status)}"></span>${esc(id)} ${esc(r.title)}</button>`;
};
const refs = (label, ids) => ids.length ? `<div class="refs"><span class="lbl">${esc(label)}</span>${ids.map(refChip).join("")}</div>` : "";
const kv = (label, v) => v == null || v === "" ? "" : `<div class="kv">${esc(label)}: <b>${esc(v)}</b></div>`;
const dots = n => n ? "●".repeat(n) + "○".repeat(Math.max(0, 3 - n)) : "";
const firstLine = b => (String(b || "").replace(/<!--[^]*?-->/g, "").split("\n").filter(l => !/^\s*#/.test(l))
  .map(l => l.replace(/^[>*\-\d. ]+/, "").replace(/\*\*/g, "").trim()).find(Boolean) || "");
const image = id => filesOn(id).find(a => a.kind === "image" && a.fileExists);

let query = "", status = "";
function matches(r) {
  if (!query) return true;
  const hay = [r.id, r.title, r.body, ...Object.values(r).filter(v => typeof v === "string")].join(" ").toLowerCase();
  return query.split(/\s+/).every(w => hay.includes(w));
}
const shown = list => list.filter(r => matches(r) && (status === "parked" ? !active(r) : active(r) && (!status || r.status === status)));
const signals = r => {
  const q = openQ(r.id);
  return q ? `<span class="flag" title="Open questions">${q} open question${q > 1 ? "s" : ""}</span>` : "";
};

function puzzleCard(r) {
  const e = ENV[r.id];
  return `<article class="card" data-id="${esc(r.id)}">
    <div class="top"><span class="rid">${esc(r.id)}</span>${pill(r.status)}${signals(r)}</div>
    <h3>${esc(r.title)}</h3>
    <div class="excerpt">${esc(firstLine(r.body))}</div>
    <div class="top">${r.mechanic ? `<span class="chip">${esc(r.mechanic)}</span>` : ""}${r.difficulty ? `<span class="chip">${esc(dots(r.difficulty))}</span>` : ""}
      <span class="opens">opens ${code(e)}</span></div>
    ${refs("needs", asList(r.props))}</article>`;
}
function propCard(r) {
  const img = image(r.id);
  return `<article class="card" data-id="${esc(r.id)}">
    ${img ? `<img class="thumb wide" src="files/${esc(img.file)}" alt="" loading="lazy">` : ""}
    <div class="top"><span class="rid">${esc(r.id)}</span>${pill(r.status)}${signals(r)}</div>
    <h3>${esc(r.title)}</h3>
    <div class="top">${[r.form, r.source].filter(Boolean).map(v => `<span class="chip">${esc(v)}</span>`).join("")}
      ${r.envelope === "start" ? `<span class="chip">in the box</span>` : r.envelope ? `<span class="opens">in ${code(ENV[r.envelope])}</span>` : `<span class="flag">no envelope</span>`}</div>
    ${refs("used by", backOf(r.id, "props").filter(active).map(x => x.id))}</article>`;
}
const grid = (list, fn) => list.length ? `<div class="grid">${list.map(fn).join("")}</div>` : `<div class="empty">Nothing here${query || status ? " matching the filter" : ""}.</div>`;
function filters() {
  return `<div class="pills" role="group" aria-label="Status">${["", ...STATUSES, "parked"].map(s =>
    `<button type="button" data-status="${s}" aria-pressed="${status === s}">${s || "all"}</button>`).join("")}</div>`;
}

// ---------- tabs ----------
const TABS = [
  { key: "story", label: "Story", count: () => ofType("premise").filter(active).length + beats().length, render: renderStory },
  { key: "puzzles", label: "Puzzles", count: () => ofType("puzzle").filter(active).length, render: renderPuzzles },
  { key: "props", label: "Props", count: () => ofType("prop").filter(active).length, render: renderProps },
];
const TYPE_TAB = { premise: "story", beat: "story", puzzle: "puzzles", prop: "props", question: "story", asset: "props" };
const TYPE_NAME = { premise: "Premise", beat: BEAT, puzzle: "Puzzle", prop: "Prop", question: "Question", asset: "File" };

function problems() {
  const w = D.warnings || [];
  if (!w.length) return "";
  return `<details class="warnbox"><summary>${w.length} problem${w.length > 1 ? "s" : ""} to fix (kit.py check)</summary><ul>${w.map(x =>
    `<li>${x.id && byId[x.id] ? refChip(x.id) : `<code>${esc(x.file)}</code>`} ${esc(x.msg)}</li>`).join("")}</ul></details>`;
}

function renderStory() {
  const prem = shown(ofType("premise"));
  const order = ["sender", "player goal", "story", "tone", "ending"];
  prem.sort((a, b) => ((order.indexOf((a.aspect || "").toLowerCase()) + 1) || 99) - ((order.indexOf((b.aspect || "").toLowerCase()) + 1) || 99));
  let h = problems() + `<h2>Premise <span class="n">who sends it, why, the tone, the ending</span></h2>` + filters()
    + grid(prem, r => `<article class="card" data-id="${esc(r.id)}"><div class="top"><span class="rid">${esc(r.aspect || "other")}</span>${pill(r.status)}${signals(r)}</div><h3>${esc(r.title)}</h3><div class="excerpt">${esc(firstLine(r.body))}</div></article>`);
  h += `<h2>${esc(BEAT)}s <span class="n">the game in order · puzzles sit under their ${esc(BEAT.toLowerCase())}</span></h2><ol class="timeline">`;
  for (const b of beats().filter(matches)) {
    const pz = backOf(b.id, "beat").filter(active);
    h += `<li><div class="beat-h" data-id="${esc(b.id)}"><h3>${esc(b.title)}</h3><span class="sub">${esc(firstLine(b.body))}</span></div>
      <div class="refs">${pz.map(p => `<button type="button" class="ref" data-id="${esc(p.id)}">${esc(p.id)} ${esc(p.title)} ${code(ENV[p.id])}</button>`).join("") || '<span class="empty">No puzzles yet.</span>'}</div></li>`;
  }
  h += `</ol>`;
  const loose = ofType("question").filter(q => active(q) && q.status === "open" && !asList(q.about).length && matches(q));
  if (loose.length) h += `<h2>Open questions about the whole adventure</h2>${loose.map(q => questionHTML(q)).join("")}`;
  const files = ofType("asset").filter(a => active(a) && !a.for && !asList(a.links).length && matches(a));
  if (files.length) h += `<h2>Other files</h2><div class="files">${files.map(fileHTML).join("")}</div>`;
  return h;
}

function renderPuzzles() {
  const list = shown(ofType("puzzle"));
  let h = problems() + `<h2>Puzzles <span class="n">${list.length} shown · cipher: ${esc(D.cipher?.name || "none")}</span></h2>` + filters();
  for (const b of beats()) {
    const group = list.filter(p => p.beat === b.id);
    if (group.length) h += `<h3 class="group">${esc(b.order ?? "")} · ${esc(b.title)}</h3>${grid(group, puzzleCard)}`;
  }
  const loose = list.filter(p => !beats().some(b => b.id === p.beat));
  if (loose.length) h += `<h3 class="group">No ${esc(BEAT.toLowerCase())} yet</h3>${grid(loose, puzzleCard)}`;
  if (!list.length) h += `<div class="empty">Nothing here${query || status ? " matching the filter" : ""}.</div>`;
  return h;
}

function renderProps() {
  const list = shown(ofType("prop"));
  const start = list.filter(p => p.envelope === "start");
  let h = problems() + `<h2>Props <span class="n">${list.length} shown · grouped by the envelope they're in</span></h2>` + filters();
  if (start.length) h += `<h3 class="group">In the box from the start</h3>${grid(start, propCard)}`;
  for (const e of D.envelopes?.envelopes || []) {
    const inside = list.filter(p => p.envelope === e.puzzle);
    if (inside.length) h += `<h3 class="group">Envelope ${code(e)} <span class="n">opened by ${esc(e.puzzle)} ${esc(e.title)}</span></h3>${grid(inside, propCard)}`;
  }
  const loose = list.filter(p => p.envelope !== "start" && !ENV[p.envelope]);
  if (loose.length) h += `<h3 class="group">Not in an envelope yet</h3>${grid(loose, propCard)}`;
  if (!list.length) h += `<div class="empty">Nothing here${query || status ? " matching the filter" : ""}.</div>`;
  return h;
}

// ---------- detail drawer ----------
const HIDE = new Set(["id", "title", "type", "status", "body", "path", "touched", "ageDays", "dirty", "stale", "history", "fileExists", "answer", "file", "for"]);
function fileHTML(a) {
  const img = a.kind === "image" && a.fileExists;
  return `<div class="file" data-id="${esc(a.id)}">${img ? `<img src="files/${esc(a.file)}" alt="" loading="lazy">` : `<div class="ph">${esc(a.kind || "file")}</div>`}
    <span class="fname">${esc(a.title)}</span><span class="rid">${a.file ? (a.fileExists ? esc(a.file) : "missing: " + esc(a.file)) : "not made yet"}</span></div>`;
}
function questionHTML(q) {
  return `<div class="question${q.status === "open" ? " open" : ""}" data-id="${esc(q.id)}"><div class="top"><span class="rid">${esc(q.id)}</span>${pill(q.status)}</div>
    <div><b>${esc(q.title)}</b></div>${q.answer ? `<div class="answer">${inline(q.answer, refChip)}</div>` : ""}</div>`;
}
function openDetail(id) {
  const r = byId[id];
  if (!r) return;
  let h = `<button class="btn close" data-close>Close ✕</button>
    <div class="top"><span class="rid">${esc(TYPE_NAME[r.type] || r.type)} · ${esc(r.id)}</span>${pill(superseded(r) ? "parked" : r.status)}</div>
    <h2>${esc(r.title)}</h2>`;
  if (superseded(r)) h += `<div class="warnbox">Replaced by ${refChip(r.superseded_by)}</div>`;
  if (r.type === "puzzle") {
    const e = ENV[r.id];
    h += `<div class="envelope"><div><div class="kv">Answer</div><span class="spoiler big" title="Click to reveal">${esc(r.answer || "—")}</span></div><div class="arrow">→</div>
      <div><div class="kv">Opens envelope</div>${code(e, "big")}</div></div>`;
    if (e) h += e.contents.length ? refs("inside", e.contents) : `<div class="refs"><span class="lbl">inside</span><span class="flag">nothing yet: set a prop's envelope to ${esc(r.id)}</span></div>`;
  }
  if (r.type === "prop") h += (r.envelope === "start" ? refs("in", ["start"]) : r.envelope ? `<div class="refs"><span class="lbl">in envelope</span>${code(ENV[r.envelope])}${refChip(r.envelope)}</div>` : `<div class="refs"><span class="flag">not in an envelope yet</span></div>`)
    + refs("used by", backOf(r.id, "props").map(x => x.id));
  if (r.type === "beat") h += refs("puzzles", backOf(r.id, "beat").filter(active).map(x => x.id));
  const fields = Object.entries(r).filter(([k, v]) => !HIDE.has(k) && !(r.type === "prop" && k === "envelope") && !(v == null || v === "" || (Array.isArray(v) && !v.length)));
  if (fields.length) h += `<dl class="fields">${fields.map(([k, v]) => `<dt>${esc(k.replace(/_/g, " "))}</dt><dd>${
    REF.includes(k) ? `<div class="refs">${asList(v).map(refChip).join("")}</div>` : k === "difficulty" ? `${esc(dots(v))} (${esc(v)})` : esc(Array.isArray(v) ? v.join(", ") : v)}</dd>`).join("")}</dl>`;
  if (r.type === "question" && r.answer) h += `<div class="sec">Answer</div><div class="md">${inline(r.answer, refChip)}</div>`;
  if (r.type === "asset") {
    h += r.kind === "image" && r.fileExists ? `<p><img class="thumb" style="max-height:340px" src="files/${esc(r.file)}" alt=""></p>` : "";
    h += `<div class="sec">Prompt / notes</div>${r.body ? `<pre class="prompt">${esc(r.body)}</pre>` : `<div class="empty">None.</div>`}`;
  } else if (r.body) h += `<div class="sec">Notes</div><div class="md">${md(r.body, refChip)}</div>`;
  const files = filesOn(r.id);
  if (files.length) h += `<div class="sec">Files</div><div class="files">${files.map(fileHTML).join("")}</div>`;
  const qs = questionsOn(r.id);
  if (qs.length) h += `<div class="sec">Questions <span class="n">${openQ(r.id)} open</span></div>${qs.map(questionHTML).join("")}`;
  h += `<div class="sec">History</div>`;
  h += r.history.length ? `<div class="rows">${r.dirty ? `<div class="row static"><span class="when">now</span><span class="grow"><i>uncommitted edits</i></span></div>` : ""}${r.history.map(c =>
    `<div class="row static"><span class="when">${esc(c.date)}</span><span class="grow">${esc(c.subject)}</span></div>`).join("")}</div>` : `<div class="empty">Not committed yet.</div>`;
  h += `<p class="path">${esc(r.path)}</p>`;
  const dr = $("#drawer");
  dr.innerHTML = h; dr.hidden = false; $("#scrim").hidden = false; dr.scrollTop = 0;
}
function closeDetail() { $("#drawer").hidden = true; $("#scrim").hidden = true; }

// ---------- routing & events ----------
let current = TABS[0];
function route() {
  const [tab, id] = decodeURIComponent(location.hash.slice(1)).split("/");
  const t = TABS.find(x => x.key === tab) || (byId[tab] && TABS.find(x => x.key === TYPE_TAB[byId[tab].type])) || TABS[0];
  $("#tabs").innerHTML = TABS.map(x => `<a href="#${x.key}" class="${x === t ? "on" : ""}">${x.label}<span class="n">${x.count()}</span></a>`).join("");
  $("#view").innerHTML = t.render();
  if (id || byId[tab]) openDetail(id || tab); else closeDetail();
  return t;
}
const rerender = () => { $("#view").innerHTML = current.render(); };
document.addEventListener("click", e => {
  const sp = e.target.closest(".spoiler");
  if (sp) { sp.classList.toggle("shown"); return; }
  if (e.target.closest("[data-close]") || e.target.id === "scrim") { location.hash = current.key; return; }
  const st = e.target.closest("[data-status]");
  if (st) { status = st.dataset.status; rerender(); return; }
  const el = e.target.closest("[data-id]");
  if (el) location.hash = `${current.key}/${el.dataset.id}`;
});
$("#q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); rerender(); });
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
  if (e.key === "Escape") { if (!$("#drawer").hidden) location.hash = current.key; else if (query) { $("#q").value = ""; query = ""; rerender(); } }
});
window.addEventListener("hashchange", () => { current = route(); });

$("#proj").textContent = D.config.name;
document.title = D.config.name + " · design";
$("#sub").textContent = `${R.length} records · built ${D.builtAt}` + (D.warnings.length ? ` · ${D.warnings.length} problem(s)` : "");
current = route();
</script>
</body>
</html>
